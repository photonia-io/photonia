# documentation.
name: "CI"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: photonia_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/photonia_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install OS packages (from cache)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libpq-dev libexif-dev imagemagick
          version: 1.0
      - name: "Symlink imagemagick's identify command"
        run: sudo ln -sf /usr/bin/identify-im6.q16 /usr/bin/identify
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Node is needed even though this job runs no JS tests: config/vite.json
      # sets autoBuild for the test environment, so request specs that render a
      # layout make ViteRuby build the assets on demand.
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
      - name: Install Node packages
        run: yarn install --immutable
      # Add or replace database setup steps here
      - name: Set up database schema
        run: bin/rails db:schema:load
      # Add or replace test runners here
      - name: Run rspec
        run: bundle exec rspec
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          slug: photonia-io/photonia

  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
      - name: Install Node packages
        run: yarn install --immutable
      - name: Run vitest
        run: yarn test:run

