# Template for config/deploy.production.yml (gitignored). Copy this file and
# fill in the real server/hostname. Non-secret env vars live in config/deploy.yml
# (tracked); real secrets come from 1Password, see .kamal/secrets.production.

servers:
  web:
    - THE_IP_OR_HOSTNAME_OF_YOUR_SERVER
  job:
    hosts:
      - THE_IP_OR_HOSTNAME_OF_YOUR_SERVER
    cmd: bundle exec sidekiq

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: THE_HOSTNAME_OF_YOUR_SERVER
  app_port: 3000

# Use a persistent storage volume.
volumes:
  - "./photonia-web/sitemap/sitemap.xml.gz:/rails/public/sitemap.xml.gz"

# Use accessory services (secrets come from .kamal/secrets.production).
accessories:
  redis:
    image: valkey/valkey:8
    host: THE_IP_OR_HOSTNAME_OF_YOUR_SERVER
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data
