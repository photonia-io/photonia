:scheduler:
  :schedule:
    sitemap_refresh:
      cron: "0 5 * * *" # 5:00 AM
      class: SitemapRefreshJob
    precompute_related_tags:
      cron: "10 3 * * *" # 3:10 AM
      class: PrecomputeRelatedTagsJob
    precompute_search_terms:
      cron: "20 3 * * *" # 3:20 AM
      class: PrecomputeSearchTermsJob
