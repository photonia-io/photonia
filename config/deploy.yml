# Name of your application. Used to uniquely configure containers.
service: photonia

# Name of the container image.
image: janosrusiczki/photonia

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  # server: registry.digitalocean.com / ghcr.io / ...
  username: janosrusiczki

  # Always use an access token rather than real password (pulled from .kamal/secrets.<destination>).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64

# A destination is always required (kamal deploy -d production). Host-specific
# config (servers, proxy host, volumes, accessories, env.clear) lives in
# config/deploy.<destination>.yml.
require_destination: true

# Inject ENV variables into containers (secrets come from .kamal/secrets.<destination>).
# clear values aren't secret (S3_BUCKET is the public CDN hostname; the rest are
# non-sensitive numbers/strings) and don't vary by destination, so they're committed here
# rather than fetched from 1Password. MAILER_FROM_NAME/ADDRESS are omitted: Setting already
# defaults to "Photonia" / "mailer@photonia.io", which is what production uses anyway.
env:
  clear:
    THUMBNAIL_SIDE: 150
    MEDIUM_SIDE: 512
    BE_SENTRY_SAMPLE_RATE: 0.1
    FE_SENTRY_SAMPLE_RATE: 1
    S3_REGION: eu-west-1
    S3_BUCKET: photos.cdn.rusiczki.net
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - REDIS_URL
    - DEVISE_JWT_SECRET_KEY
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - REKOGNITION_ACCESS_KEY_ID
    - REKOGNITION_SECRET_ACCESS_KEY
    - SES_SMTP_USERNAME
    - SES_SMTP_PASSWORD
    - BE_SENTRY_DSN
    - FE_SENTRY_DSN
    - SIDEKIQ_WEB_USERNAME
    - SIDEKIQ_WEB_PASSWORD
    - FLICKR_API_KEY
    - GOOGLE_CLIENT_ID
    - FACEBOOK_APP_ID
    - FACEBOOK_APP_SECRET

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

# Use a different ssh user than root
#
# ssh:
#   user: app

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2
